{%- assign email = site.email | replace: ' at ', '@' | replace: ' dot ', '.' | replace: ' ', '' -%}
<section class="about">
  {%- if site.about_profile_image -%}
    <img class="about__portrait" src="{{ site.about_profile_image | relative_url }}" alt="{{ site.name | escape }}">
  {%- endif -%}

  <div class="about__text">
    <h1 class="intro">{{ site.name | escape }}.</h1>
    <div class="lede">
      {{ site.about_content | strip | markdownify }}
    </div>
  </div>
</section>
