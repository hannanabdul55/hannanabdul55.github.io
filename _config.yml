        sub_title: Software Engineer III (ML)
        caption: 2022–present
        link: https://google.com
        description: |
          Build ranking and asset-selection models for Play Ads.

          - Proposed and led format-conditional inference for the Play Ads auction model: a deep recommendation model that predicts per valid ad format for each query instead of once per ad. Since adopted and launched by another Google ad stack.
          - Replaced static score-based asset selection with a learned model that picks the best creative asset per ad impression.
          - Shipped 39 production launches across ranking, serving, and product teams; mentor engineers and present at internal Ads summits.

      - title: Sway AI
