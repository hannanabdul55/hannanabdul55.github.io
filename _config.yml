# About Section
about_profile_image: images/abdul.jpeg
about_content: |
  I'm a software engineer at Google, improving ads recommendation models.

  My broader interest is in safety and fairness in large-scale ML systems. Previously, I contributed to [Microsoft Fairlearn](https://fairlearn.org) and the [Seldonian framework](https://seldonian-fairml.readthedocs.io/), and maintained the [COVID-19 Forecast Hub](https://covid19forecasthub.org) under [Prof. Nicholas Reich](https://reichlab.io). It was the official data source for the CDC's COVID-19 forecasting page.

  Before Google I built ML workflows on AWS SageMaker as an applied data scientist at Sway AI, and worked on QuickBooks Mobile as a software engineer at Intuit.

  Outside work I hike, run, and play the drums.

content:
  - title: Projects
    layout: list
    content:
      - title: Seldonian Library
        link: https://seldonian-fairml.readthedocs.io/en/latest/
        link_text: Project homepage
        additional_links:
          - title: GitHub
            url: https://github.com/hannanabdul55/seldonian-fairness
        description: |
          A Python library for training ML models and RL agents under the Seldonian framework, as described in [Thomas et al., Science 2019](https://science.sciencemag.org/cgi/rapidpdf/366/6468/999). Supports any optimizer from [scipy.optimize](https://docs.scipy.org/doc/scipy/reference/generated/scipy.optimize.minimize.html) and ships a [CMA-ES](https://en.wikipedia.org/wiki/CMA-ES) implementation.

      - title: Fairlearn
        link: https://fairlearn.github.io/
        link_text: Homepage
        additional_links:
          - title: GitHub
            url: https://github.com/fairlearn/fairlearn
        description: |
          Open-source Python library from Microsoft for training ML models under fairness constraints. I implemented the Equality of Opportunity constraint and worked on scalability experiments for training under it.

  - title: Experience
    layout: list
    content:
      - title: Google
        sub_title: Software Engineer (ML)
        caption: 2022–present
        link: https://google.com
        description: |
          Improving ads recommendation models.

      - title: Sway AI
        sub_title: Applied Data Scientist
        caption: 2021–2022
        description: |
          Built end-to-end ML workflows on AWS SageMaker, spanning data preprocessing, training, and deployment. Translated client-specific solutions into reusable components for a no-code self-service ML platform.

      - title: Reich Lab, UMass Amherst
        sub_title: Research Engineer
        caption: 2020–2021
        link: https://covid19forecasthub.org
        description: |
          Owned the data validation, visualization, and build pipeline for the [COVID-19 Forecast Hub](https://covid19forecasthub.org), the official data source for the CDC's COVID-19 forecasting page. Rebuilt the submission validation pipeline, taking validation time from about 20 minutes down to under a minute and unblocking weekly submissions from 50+ research teams.

      - title: Intuit
        sub_title: Software Development Engineer 2
        caption: 2015–2019
        link: https://intuit.com
        description: |
          Shipped on-device ML receipt validation using MLKit, eliminating manual transcription overhead. Built a cross-platform "build once, deploy everywhere" framework adopted by all Intuit product teams, and delivered features end-to-end for QuickBooks Mobile.

