about_profile_image: images/abdul.jpeg
about_content: |
  I'm a machine learning engineer at Google, building ranking and asset-selection models for Play Ads.

  My broader interests are reinforcement learning and safety and fairness in large-scale ML systems. Previously, I contributed to [Microsoft Fairlearn](https://fairlearn.org) and the [Seldonian framework](https://seldonian-fairml.readthedocs.io/), and maintained the [COVID-19 Forecast Hub](https://covid19forecasthub.org) under [Prof. Nicholas Reich](https://reichlab.io). It was the official data source for the CDC's COVID-19 forecasting page.

  Before Google I built ML workflows on AWS SageMaker as an applied data scientist at Sway AI, and worked on QuickBooks Mobile as a software engineer at Intuit.

  Outside work I hike, run, and play the drums.

content:
  - title: Projects
    layout: list
    content:
      - title: Seldonian Library
        link: https://seldonian-fairml.readthedocs.io/en/latest/
        link_text: Project homepage
        additional_links:
          - title: GitHub
            url: https://github.com/hannanabdul55/seldonian-fairness
        description: |
          A Python library for training ML models and RL agents under the Seldonian framework, as described in [Thomas et al., Science 2019](https://science.sciencemag.org/cgi/rapidpdf/366/6468/999). Supports any optimizer from [scipy.optimize](https://docs.scipy.org/doc/scipy/reference/generated/scipy.optimize.minimize.html) and ships a [CMA-ES](https://en.wikipedia.org/wiki/CMA-ES) implementation.

          Extending the framework with stratified sampling increased the probability of returning a safe solution by about 60% in worst-case binary classification settings. For RL, it implements safe policy improvement: policies are optimized with CMA-ES or the cross-entropy method against high-confidence bounds on per-decision importance sampling (PDIS) off-policy estimates.

      - title: Fairlearn
        link: https://fairlearn.github.io/
        link_text: Homepage
        additional_links:
          - title: GitHub
            url: https://github.com/fairlearn/fairlearn
        description: |
          Open-source Python library from Microsoft for training ML models under fairness constraints. I implemented the [Equality of Opportunity constraint](https://github.com/fairlearn/fairlearn/pull/362) and made [ExponentiatedGradient's estimator copying more efficient](https://github.com/fairlearn/fairlearn/pull/526); both were merged. Benchmarked against TensorFlow Constrained Optimization.

