        caption: 2021–2022
        description: |
          Built end-to-end ML workflows on AWS SageMaker for enterprise clients — visual anomaly detection for an aeronautics client, object detection serving for a radiology client, and caller sentiment analysis for a customer-service client. Translated them into reusable components for a no-code self-service ML platform.

